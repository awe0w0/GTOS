name: GTOS kernel and desktop acceptance
on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    # Expanded x64 host/model gates run alongside the retained desktop suite.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install official build and emulation tools
        run: bash .github/scripts/install-ubuntu-tools.sh g++ binutils grub-pc-bin grub-common xorriso mtools qemu-system-x86 qemu-user python3-pil
      - name: Build GRUB boot image
        run: make -j2 GTOS.iso GTOS-legacy.iso GTOS-native-test.iso
      - name: Test actual allocator, scheduler, storage and VM code
        run: make test
      - name: Verify AP startup and bounded error paths
        run: ./tests/cpu_startup_smoke.sh
      - name: Verify isolated AP workers and per-worker fault containment
        run: ./tests/cpu_work_pool_smoke.sh
      - name: Verify real native userspace and recoverable process faults
        run: ./tests/native_process_smoke.sh
      - name: Verify owned native data-page VM and process reclamation
        run: ./tests/native_vm_smoke.sh "$RUNNER_TEMP/gtos-native-vm"
      - name: Verify native caller identity, stack bounds and reclamation
        run: ./tests/native_process_info_smoke.sh "$RUNNER_TEMP/gtos-native-process-info"
      - name: Verify native RTC calendar with independent host oracle
        env:
          CXX: /usr/bin/g++
        run: /usr/bin/python3 tests/native_realtime_calendar.py "$RUNNER_TEMP/gtos-realtime-calendar" --sanitizers
      - name: Verify real UTC and original monotonic ABI in CPL3
        env:
          CXX: /usr/bin/g++
        run: /usr/bin/python3 tools/verify-native-realtime.py "$RUNNER_TEMP/gtos-realtime-guest"
      - name: Diagnose enabled FP users with modern desktop and AP workers
        # Supplementary pointer-qualified QEMU evidence, not strict FP acceptance.
        # The strict x87 pointer/#MF/#XM/reserved-MXCSR matrix is run with Bochs.
        env:
          GTOS_FP_DESKTOP_OUTPUT: /tmp/gtos-qemu-fp-diagnostic
          GTOS_FP_OPTIMIZATIONS: '0 2'
          GTOS_BUILD_JOBS: '2'
        run: ./tests/native_fp_desktop_diagnostic.sh
      - name: Verify page protections with actual CPU faults
        run: ./tests/paging_smoke.sh
      - name: Verify legacy VGA fallback after GRUB video setup
        run: /usr/bin/python3 tests/qemu_smoke.py --iso GTOS-legacy.iso --output /tmp/gtos-qemu-legacy
      - name: Boot and interact with the high-resolution desktop
        run: /usr/bin/python3 tests/desktop_qemu.py --output /tmp/gtos-qemu-desktop
      - name: Exercise desktop input while native processes are running
        run: /usr/bin/python3 tests/native_desktop_qemu.py --output /tmp/gtos-qemu-native-desktop
      - name: Verify Chinese input and persistent language preferences
        run: /usr/bin/python3 tests/desktop_language_qemu.py --output /tmp/gtos-qemu-language
      - name: Verify separate x64 long-mode protection foundation
        # Experimental BSP-only target; does not replace the i386 desktop.
        run: /usr/bin/python3 arch/x86_64/tests/boot_qemu.py --output "$RUNNER_TEMP/gtos-x64"
      - name: Verify x64 physical frame ownership and reclamation
        run: /usr/bin/python3 arch/x86_64/tests/frame_qemu.py --output "$RUNNER_TEMP/gtos-x64-frames"
      - name: Run strict host sanitizers
        run: |
          GTOS_DESKTOP_SANITIZERS=1 ./tests/desktop_test.sh
          GTOS_I18N_SANITIZERS=1 ./tests/i18n_test.sh
          ./tests/settings_sanitizer_test.sh

  verify_sparse_vm:
    # Keep the full sparse-VM matrix separate from the desktop job's budget.
    # This is an internal supervisor-only x64 service, not browser execution.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install official x64 build and emulation tools
        run: bash .github/scripts/install-ubuntu-tools.sh gcc binutils grub-pc-bin grub-common xorriso mtools qemu-system-x86 python3
      - name: Verify full sparse VM ownership, faults and rollback
        run: /usr/bin/python3 arch/x86_64/tests/vm_qemu.py --output "$RUNNER_TEMP/gtos-x64-vm"


  verify_native_filesystem:
    # Full ATA backend qualification; not CPL3 or browser execution.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install official filesystem qualification tools
        run: bash .github/scripts/install-ubuntu-tools.sh g++ gcc binutils grub-pc-bin grub-common xorriso mtools qemu-system-x86 python3
      - name: Verify full IA32 backend and every completed-sector interruption
        env:
          CXX: /usr/bin/g++
          CC: /usr/bin/gcc
        run: /usr/bin/python3 tools/build-filestore-probe.py "$RUNNER_TEMP/gtos-filesystem"

  verify_native_file_abi:
    # Actual CPL3 file service with scalar compiler helpers; LLVM stdio remains unqualified.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install official native file qualification tools
        run: bash .github/scripts/install-ubuntu-tools.sh g++ gcc binutils grub-pc-bin grub-common xorriso mtools qemu-system-x86 python3
      - name: Verify native file boundaries, real I/O and deferred owner reclamation
        env:
          CXX: /usr/bin/g++
          CC: /usr/bin/gcc
        run: /usr/bin/python3 tools/build-native-file-probe.py "$RUNNER_TEMP/gtos-native-files"
      - name: Self-review observer rejection and actual service instruction policy
        run: /usr/bin/python3 tools/self-review-native-files.py "$RUNNER_TEMP/gtos-native-files-review" "$RUNNER_TEMP/gtos-native-files"
