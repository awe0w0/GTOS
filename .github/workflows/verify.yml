name: GTOS kernel and desktop acceptance
on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install official build and emulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ binutils grub-pc-bin grub-common xorriso mtools qemu-system-x86 qemu-user python3-pil
      - name: Build GRUB boot image
        run: make -j2 GTOS.iso GTOS-legacy.iso
      - name: Test actual allocator, scheduler, storage and VM code
        run: make test
      - name: Verify AP startup and bounded error paths
        run: ./tests/cpu_startup_smoke.sh
      - name: Verify page protections with actual CPU faults
        run: ./tests/paging_smoke.sh
      - name: Verify legacy VGA fallback after GRUB video setup
        run: /usr/bin/python3 tests/qemu_smoke.py --iso GTOS-legacy.iso --output /tmp/gtos-qemu-legacy
      - name: Boot and interact with the high-resolution desktop
        run: /usr/bin/python3 tests/desktop_qemu.py --output /tmp/gtos-qemu-desktop
      - name: Verify Chinese input and persistent language preferences
        run: /usr/bin/python3 tests/desktop_language_qemu.py --output /tmp/gtos-qemu-language
      - name: Run strict host sanitizers
        run: |
          GTOS_DESKTOP_SANITIZERS=1 ./tests/desktop_test.sh
          GTOS_I18N_SANITIZERS=1 ./tests/i18n_test.sh
          ./tests/settings_sanitizer_test.sh
