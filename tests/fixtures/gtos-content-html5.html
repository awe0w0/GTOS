<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTOS Content HTML5 test</title>
<style>
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  #surface, #worker-confirmed {
    display: block;
    width: 100%;
    height: 100%;
    padding: 0;
    border: 0;
    outline: 0;
    background: #202020;
  }
  #surface[data-phase="ready"] { background: #a52bc7; }
  #surface[data-phase="clicked"] { background: #12a86d; }
  #surface[data-phase="failed"] { background: #b01818; color: white; }
  #worker-confirmed {
    align-content: center;
    background: #f4af22;
    color: #201700;
    text-align: center;
  }
</style>
<button id="surface" type="button">Test Canvas and form validation</button>
<form id="form" hidden>
  <input id="email" type="email" required>
</form>
<canvas id="canvas" width="4" height="4" hidden></canvas>
<script>
  "use strict";
  const surface = document.getElementById("surface");
  const form = document.getElementById("form");
  const email = document.getElementById("email");
  const canvas = document.getElementById("canvas");
  surface.dataset.phase = "ready";

  function fail(message) {
    surface.dataset.phase = "failed";
    surface.textContent = message;
  }

  surface.addEventListener("click", event => {
    if (!event.isTrusted || surface.dataset.phase !== "ready") return;

    if (form.checkValidity() || !email.validity.valueMissing) {
      return fail("Required form field accepted an empty value");
    }
    email.value = "invalid";
    if (form.checkValidity() || !email.validity.typeMismatch) {
      return fail("Email field accepted an invalid address");
    }
    email.value = "gtos@example.test";
    if (!form.checkValidity()) return fail("Valid email address was rejected");

    const context = canvas.getContext("2d");
    if (!context) return fail("Canvas 2D is unavailable");
    context.fillStyle = "#1182d1";
    context.fillRect(1, 1, 2, 2);
    const pixels = context.getImageData(0, 0, 4, 4).data;
    for (let y = 0; y < 4; ++y) {
      for (let x = 0; x < 4; ++x) {
        const expected = x >= 1 && x <= 2 && y >= 1 && y <= 2
          ? [17, 130, 209, 255] : [0, 0, 0, 0];
        const offset = (y * 4 + x) * 4;
        if (!expected.every((value, channel) => pixels[offset + channel] === value)) {
          return fail("Canvas pixel readback differs");
        }
      }
    }

    surface.dataset.phase = "clicked";
    surface.textContent = "Press G to test Worker messaging";
    surface.focus();
  });

  surface.addEventListener("keydown", event => {
    if (!event.isTrusted || event.code !== "KeyG" ||
        surface.dataset.phase !== "clicked") return;
    surface.dataset.phase = "working";
    const values = [0, 1, 2, 4, 8, 16, 32, 64, 127, 128, 170, 255];
    const buffer = new Uint8Array(values).buffer;
    const url = URL.createObjectURL(new Blob([`
      "use strict";
      self.onmessage = ({data}) => {
        const bytes = new Uint8Array(data);
        for (let i = 0; i < bytes.length; ++i) bytes[i] ^= 0xa5;
        self.postMessage({bytes, buffer: data}, [data]);
      };
    `], {type: "text/javascript"}));
    let worker;
    function release() {
      if (worker) worker.terminate();
      URL.revokeObjectURL(url);
    }
    try {
      worker = new Worker(url);
      worker.onmessage = ({data}) => {
        release();
        if (buffer.byteLength !== 0 ||
            !(data.bytes instanceof Uint8Array) ||
            data.bytes.buffer !== data.buffer || data.bytes.length !== values.length ||
            !values.every((value, i) => data.bytes[i] === (value ^ 0xa5))) {
          return fail("Worker reply or buffer transfer differs");
        }
        const marker = document.createElement("a");
        marker.id = "worker-confirmed";
        marker.href = "video.html";
        marker.textContent = "Canvas, form validation and Worker passed. Continue to video.";
        document.body.replaceChildren(marker);
      };
      worker.onerror = worker.onmessageerror = () => {
        release();
        fail("Worker could not exchange messages");
      };
      worker.postMessage(buffer, [buffer]);
    } catch (error) {
      release();
      fail(String(error));
    }
  });
</script>
