<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTOS Content local input test</title>
<style>
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  #surface, #key-confirmed {
    display: block;
    width: 100%;
    height: 100%;
    padding: 0;
    border: 0;
    outline: 0;
    background: #202020;
  }
  #surface[data-phase="ready"] { background: #a52bc7; }
  #surface[data-phase="clicked"] { background: #12a86d; }
  #key-confirmed {
    align-content: center;
    background: #f4af22;
    color: #201700;
    text-align: center;
  }
</style>
<button id="surface" type="button" aria-label="Activate the GTOS test"></button>
<script>
  "use strict";
  const surface = document.getElementById("surface");
  surface.dataset.phase = "ready";
  surface.addEventListener("click", event => {
    if (event.isTrusted) {
      surface.dataset.phase = "clicked";
      surface.focus();
    }
  });
  surface.addEventListener("keydown", event => {
    if (!event.isTrusted || event.code !== "KeyG" ||
        surface.dataset.phase !== "clicked") {
      return;
    }
    const marker = document.createElement("a");
    marker.id = "key-confirmed";
    marker.href = "html5.html";
    marker.textContent = "Continue to HTML5";
    document.body.replaceChildren(marker);
  });
</script>
